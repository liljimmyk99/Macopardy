    <ellipse cx="512" cy="150" rx="520" ry="260" fill="url(#gloss)" opacity="0.5"/>
  </g>
  <rect x="101.500" y="101.500" width="821" height="821" rx="183.500" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Board grid 3x3 -->
  <g filter="url(#tileShadow)">
    <g id="tiles">
      <rect x="237" y="237" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="427" y="237" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="617" y="237" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="237" y="427" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="617" y="427" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="237" y="617" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="427" y="617" width="170" height="170" rx="26" fill="url(#tile)"/>
      <rect x="617" y="617" width="170" height="170" rx="26" fill="url(#tile)"/>
    </g>
  </g>
