  <g fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2.500">
    <rect x="238.500" y="238.500" width="167" height="167" rx="24.500"/>
    <rect x="428.500" y="238.500" width="167" height="167" rx="24.500"/>
    <rect x="618.500" y="238.500" width="167" height="167" rx="24.500"/>
    <rect x="238.500" y="428.500" width="167" height="167" rx="24.500"/>
    <rect x="618.500" y="428.500" width="167" height="167" rx="24.500"/>
    <rect x="238.500" y="618.500" width="167" height="167" rx="24.500"/>
    <rect x="428.500" y="618.500" width="167" height="167" rx="24.500"/>
    <rect x="618.500" y="618.500" width="167" height="167" rx="24.500"/>
  </g>
  <g fill="url(#gloss)" opacity="0.55">
    <path d="M263 237h118a26 26 0 0 1 26 26v50H237v-50a26 26 0 0 1 26-26z"/>
    <path d="M453 237h118a26 26 0 0 1 26 26v50H427v-50a26 26 0 0 1 26-26z"/>
    <path d="M643 237h118a26 26 0 0 1 26 26v50H617v-50a26 26 0 0 1 26-26z"/>
    <path d="M263 427h118a26 26 0 0 1 26 26v50H237v-50a26 26 0 0 1 26-26z"/>
    <path d="M643 427h118a26 26 0 0 1 26 26v50H617v-50a26 26 0 0 1 26-26z"/>
    <path d="M263 617h118a26 26 0 0 1 26 26v50H237v-50a26 26 0 0 1 26-26z"/>
    <path d="M453 617h118a26 26 0 0 1 26 26v50H427v-50a26 26 0 0 1 26-26z"/>
    <path d="M643 617h118a26 26 0 0 1 26 26v50H617v-50a26 26 0 0 1 26-26z"/>
  </g>

  <!-- Gold clue tile (center) -->
  <g filter="url(#goldGlow)">
    <rect x="417" y="417" width="190" height="190" rx="30" fill="url(#gold)"/>
  </g>
  <rect x="418.500" y="418.500" width="187" height="187" rx="28.500" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="3"/>
  <path d="M447 417h130a30 30 0 0 1 30 30v46H417v-46a30 30 0 0 1 30-30z" fill="url(#gloss)" opacity="0.7"/>
  <text x="512" y="568" text-anchor="middle" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="170" fill="#1a2c80" filter="url(#emboss)">$</text>
